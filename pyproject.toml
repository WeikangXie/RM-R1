[project]
name = "rm-r1-content-tools"
version = "0.1.0"
description = "Data preparation and evaluation tools for the Content RM workflow"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "pydantic>=2.10",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["content_rm/tests"]
pythonpath = ["content_rm/data"]
